plugins {
    id 'java'
    id 'checkstyle'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '9.5.1'
}

checkstyle {
    toolVersion = '10.12.5'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

javafx {
    version = '23.0.1'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    String jUnitVersion = '5.10.2'
    String javaFxVersion = '23.0.1'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    // Include JavaFX's native graphics libraries for every supported desktop OS.
    // This makes the Shadow JAR portable: the JavaFX runtime selects the correct
    // native library at startup on Windows, Linux, or macOS.
    ['win', 'linux', 'mac'].each { platform ->
        runtimeOnly "org.openjfx:javafx-graphics:${javaFxVersion}:${platform}"
    }
}

test {
    useJUnitPlatform()
    jvmArgs '-ea'

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

application {
    mainClass.set('yappa.ui.Launcher')
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

jar {
    enabled = false
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'Yappa.jar'
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'yappa.ui.Launcher'
    }
}

run {
    standardInput = System.in
    jvmArgs = ['-ea', '--enable-native-access=javafx.graphics']
}
